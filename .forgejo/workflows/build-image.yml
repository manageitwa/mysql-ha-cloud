name: Docker Image

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Log in to the Container registry
        uses: https://github.com/docker/login-action@v4
        with:
          registry: source.selfmanager.net.au
          username: ${{ secrets.PACKAGE_DEPLOY_USERNAME }}
          password: ${{ secrets.PACKAGE_DEPLOY_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: https://github.com/docker/metadata-action@v6
        with:
          images: source.selfmanager.net.au/${{ forgejo.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: https://github.com/docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
