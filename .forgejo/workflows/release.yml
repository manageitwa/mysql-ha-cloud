name: Release
on:
  push:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          FORGEJO_URL: https://source.selfmanager.net.au
          FORGEJO_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO_OWNER: ${{ forgejo.repository_owner }}
          REPO_NAME: "mysql-ha-cloud"
          WORKFLOW_FILE: build-image.yml
        run: npx --package semantic-release --package @semantic-release/exec --package @ribbon-studios/semantic-release-forgejo semantic-release
